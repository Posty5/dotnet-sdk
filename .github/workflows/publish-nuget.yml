name: Publish to NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Create NuGet packages
        run: |
          dotnet pack src/Posty5.Core/Posty5.Core.csproj --configuration Release --output ./nupkg --no-build
          dotnet pack src/Posty5.QRCode/Posty5.QRCode.csproj --configuration Release --output ./nupkg --no-build
          dotnet pack src/Posty5.ShortLink/Posty5.ShortLink.csproj --configuration Release --output ./nupkg --no-build
          dotnet pack src/Posty5.HtmlHosting/Posty5.HtmlHosting.csproj --configuration Release --output ./nupkg --no-build
          dotnet pack src/Posty5.HtmlHostingVariables/Posty5.HtmlHostingVariables.csproj --configuration Release --output ./nupkg --no-build
          dotnet pack src/Posty5.HtmlHostingFormSubmission/Posty5.HtmlHostingFormSubmission.csproj --configuration Release --output ./nupkg --no-build
          dotnet pack src/Posty5.SocialPublisherWorkspace/Posty5.SocialPublisherWorkspace.csproj --configuration Release --output ./nupkg --no-build
          dotnet pack src/Posty5.SocialPublisherPost/Posty5.SocialPublisherPost.csproj --configuration Release --output ./nupkg --no-build

      - name: List created packages
        run: ls -lh ./nupkg/*.nupkg

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: 📧 Send publish email notification
        if: always() # if the publish succeeds or fails
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: "Posty5 Deploy Bot <${{ secrets.SMTP_USER }}>"
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: |
            [${{ github.repository }}] 📦 Publish ${{ job.status }} — ${{ github.ref_name }}
          body: |
            Repository: ${{ github.repository }}
            Ref: ${{ github.ref_name }}
            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
